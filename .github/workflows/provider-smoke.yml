name: Check AI provider

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --frozen
      - name: Check structured summary
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://api.minimax.cn/v1' }}
          MODEL_NAME: ${{ vars.MODEL_NAME || 'MiniMax-M2.7' }}
        run: uv run python ai/smoke_provider.py
